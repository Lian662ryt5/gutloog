name: Tests

# Runs the Playwright suite on every push and pull request targeting main,
# so a broken commit is caught before it can reach the branch GitHub Pages
# deploys from.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  e2e:
    # Pinned rather than ubuntu-latest: that alias rolled to ubuntu-26.04,
    # which Playwright 1.56.1 doesn't yet support installing Chromium's
    # system deps on ("ERROR: Playwright does not support chromium on
    # ubuntu26.04-x64") - breaks the browser-install step before any test
    # even runs, regardless of what changed in the PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
